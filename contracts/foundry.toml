[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
# CODE DAO uses timestamps everywhere (§12). block.number must never appear.
# The enforcing check is ./check-no-block-number.sh, run in CI: the property is about source text
# rather than runtime behaviour, so a Solidity test cannot express it.

[profile.default.fuzz]
runs = 512
max_test_rejects = 200000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
shrink_run_limit = 5000

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 1024
depth = 128

[profile.deep.fuzz]
runs = 100000

[profile.deep.invariant]
runs = 5000
depth = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

# Blockscout. The key field is required by Foundry and ignored by the explorer.
# Mainnet 4663; testnet 46630.
[etherscan]
robinhood = { key = "${ROBINHOOD_ETHERSCAN_KEY}", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }
robinhood_testnet = { key = "${ROBINHOOD_ETHERSCAN_KEY}", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }
